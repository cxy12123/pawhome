server:
  port: 8888

spring:
  application:
    name: pawhome-config
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # 配置文件放在 resources/config-repo 下，随 jar 一起发布
          search-locations: classpath:/config-repo/

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.config: INFO
